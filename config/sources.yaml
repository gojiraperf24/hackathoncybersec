# Keyword sets used to filter platform streams before classification
keywords:
  - pothole
  - "damaged road"
  - "power outage"
  - "no water"
  - garbage
  - sewage
  - streetlight
  - "meter fault"

# Department handles used to catch tagged posts
department_handles:
  - "@PWD"
  - "@ElectricityBoard"
  - "@MunicipalCorp"

x:
  # X API v2 recent search: OR them into one query
  query_extra: "(pothole OR \"damaged road\" OR garbage OR \"no water\") -is:retweet lang:en"
  max_results: 100
  poll_interval_sec: 300

# youtube:

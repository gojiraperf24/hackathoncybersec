rss:
  feeds:
    - name: "reddit-india"
      url: "https://www.reddit.com/r/india/new/.rss"
    - name: "reddit-bangalore"
      url: "https://www.reddit.com/r/bangalore/new/.rss"
  poll_interval_sec: 600

youtube:
  queries:
    - "bihar traffic"
    - "bihar pothole"